<html lang="en">

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="news-detail-page">
          <script src="news-detail.js?v=2"></script>

        <span class="news-source" id="news-source"></span>
        <p class="eyebrow" id="news-category"></p>

        <p class="news-detail-summary" id="news-summary"></p>

      </article>
    </main>
    <script src="news-detail.js"></script>
  </body>
