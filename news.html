<!doctype html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>News detail · TradeTracker</title>

    <link rel="stylesheet" href="styles.css" />

  </head>

  <body>

    <main class="news-detail-page">

      <aside class="guest-mode-banner hidden" id="guest-mode-banner" role="status">
        <span data-guest-copy></span>
        <button class="guest-exit-button" type="button" data-exit-guest>Exit guest mode</button>
        <a class="guest-exit-button hidden" href="index.html?auth=signin" data-signin-link>Sign in for current data</a>
      </aside>

      <article class="panel news-detail-card">

        <span class="news-source" id="news-source"></span>

        <p class="eyebrow" id="news-category"></p>

        <h1 id="news-title"></h1>

        <p class="news-detail-summary" id="news-summary"></p>

        <p class="news-detail-copy" id="news-details"></p>

        <a class="primary-button original-link" id="original-link" target="_blank" rel="noreferrer">Read original article ↗</a>

        <p class="news-disclaimer">News summaries are provided for context. TradeTracker does not endorse the source or provide financial advice.</p>

      </article>

    </main>
    <script src="auth-config.js"></script>
    <script src="guest-mode.js"></script>
    <script src="data-fetcher.js"></script>
    <script src="news-detail.js?v=4"></script>
  </body>

</html>
