name: Update TradeTracker data

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate 365-day feeds
        run: node update-data.mjs
      - name: Commit refreshed feeds
        run: |
          git config user.name "TradeTracker data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Refresh 365-day public data feeds"
          git push
