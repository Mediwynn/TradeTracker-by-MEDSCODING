<!doctype html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Relevant government and market news from the last 365 days." />

    <script>

      if (localStorage.getItem("public-ledger-theme") === "dark") document.documentElement.classList.add("dark-mode");

    </script>

    <title>News · TradeTracker</title>

    <script src="news-list.js?v=5"></script>

  </head>

  <body>

    <main class="news-list-page">

      <a class="back-link" href="index.html#news">← Back to TradeTracker</a>

      <section class="panel news-browser">

        <div class="panel-heading">

          <div>

            <p class="eyebrow">CONTEXT FEED</p>

            <h1>Relevant news</h1>

            <p class="news-browser-intro">Top government, policy, and market stories connected to the tracked disclosures.</p>

          </div>

          <div class="news-heading-actions">

            <span class="record-count" id="news-count"></span>

            <button class="icon-button" id="news-theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">☾</button>

          </div>

        </div>

        <div class="news-controls">

          <label class="search-box">

            <span>⌕</span>

            <input id="news-search" type="search" placeholder="Search news, source, or category" />

          </label>

          <label class="select-wrap">

            <span class="sr-only">Sort news</span>

            <select id="news-sort">

              <option value="relevance">Most relevant</option>

              <option value="newest">Newest first</option>

              <option value="oldest">Oldest first</option>

              <option value="source">Source A–Z</option>

            </select>

          </label>

          <label class="select-wrap">

            <span class="sr-only">Filter category</span>

            <select id="news-category-filter">

              <option value="all">All categories</option>

              <option value="Markets">Markets</option>

              <option value="Government">Government</option>

              <option value="Policy & markets">Policy &amp; markets</option>

            </select>

          </label>

        </div>

        <p class="news-range" id="news-range"></p>

        <p class="news-showing" id="news-showing"></p>

        <div class="news-results" id="news-results"></div>

        <p class="news-empty hidden" id="news-empty">No news matches these filters.</p>

        <div class="news-pagination" aria-label="News pages">

          <button class="page-button" id="news-prev" aria-label="Previous news page">←</button>

          <strong class="page-indicator" id="news-page">1/1</strong>

          <button class="page-button" id="news-next" aria-label="Next news page">→</button>

        </div>

      </section>

    </main>

    <script src="news-list.js?v=5"></script>

  </body>

</html>
